name: Quarterly Variant Update

on:
  schedule:
    - cron: '0 12 1 1,4,7,10 *'  # Jan 1, Apr 1, Jul 1, Oct 1 at 12:00 UTC
  workflow_dispatch:  # allow manual trigger

jobs:
  update-variants:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl biopython

      - name: Search for new publications and update raw data
        run: python scripts/update_variants.py

      - name: Regenerate normalized data (data/variants.json + assets/data.js)
        run: python scripts/normalize_data.py

      - name: Commit updated data
        run: |
          git config --global user.name 'Blood Group Variant Bot'
          git config --global user.email 'bot@github.com'
          git add data/variants_raw.json data/variants.json assets/data.js data/update_log.json
          git diff --cached --quiet || git commit -m "Quarterly variant update - $(date +%Y-%m-%d)"
          git push
